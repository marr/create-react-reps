# Vite+ rewrites pinned versions to catalog: during `vp create`. Standalone projects
# need every catalog: entry defined here (see vite:application for vite/vitest/vite-plus).
catalogs:
  default:
    "@base-ui/react": 1.8.0
    "@fontsource-variable/inter": 5.3.0
    "@shadcn/lint": 0.2.0
    "@tailwindcss/vite": 4.3.3
    "@testing-library/react": 16.3.3
    "@testing-library/user-event": 14.6.7
    "@types/node": 26.6.4
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    "@vitejs/plugin-react": 6.1.2
    class-variance-authority: 0.7.1
    cn: 0.4.0
    cube-motion: 0.1.0
    happy-dom: 20.14.5
    lucide-react: 1.52.0
    react: 19.3.0
    react-dom: 19.3.0
    react-router: 8.4.0
    shadcn: 4.21.4
    tailwindcss: 4.3.3
    tw-animate-css: 1.4.0
    typescript: 7.0.2
    vitest: 5.0.3
    vite-plus: 1.1.0
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
